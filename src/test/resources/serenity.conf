serenity {
  project.name = "SI-GESTA - Pruebas E2E BDD"
  take.screenshots = FOR_EACH_ACTION
  logging = VERBOSE
  encoding = "UTF-8"
  compress.filenames = false
}

webdriver {
  driver = chrome
  autodownload = true
  timeouts {
    implicitlywait = 0
    fluentwait = 20000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "remote-allow-origins=*", "disable-infobars",
              "disable-gpu", "no-sandbox", "disable-dev-shm-usage", "lang=es-BO"]
    }
  }
}

# headless.mode = true  -> descomentar para ejecutar sin ventana (p. ej. en un agente de Jenkins sin escritorio)
headless.mode = false

sigesta {
  url.base = "http://localhost:5173"
}

environments {
  default {
    webdriver.base.url = "http://localhost:5173"
  }
}
